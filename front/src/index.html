<!DOCTYPE html>
<html lang="pl-PL">

<head>
    <!-- src/index.html -->
    <meta charset="UTF-8">
    <base href="/">

    <!-- Block replaced per page by the server (app.js) – it inserts the canonical, og:url
         and absolute URLs. The content below is a fallback for when the file reaches the
         browser bypassing the server (service worker cache). There is deliberately no
         og:image or logo here: OG and schema.org require absolute URLs, and the domain is
         unknown at build time – a scraper would ignore a relative path anyway.
         Do not touch the seo:start / seo:end markers. -->
    <!--seo:start-->
    <title>GeoSilesia</title>
    <meta name="description"
          content="GeoSilesia to „Edukacyjno-informacyjny serwis internetowy o dziedzictwie geologicznym, geomorfologicznym i poprzemysłowym województwa śląskiego”.">
    <meta property="og:type"
          content="website">
    <meta property="og:site_name"
          content="GeoSilesia">
    <meta property="og:title"
          content="GeoSilesia">
    <meta property="og:description"
          content="GeoSilesia to „Edukacyjno-informacyjny serwis internetowy o dziedzictwie geologicznym, geomorfologicznym i poprzemysłowym województwa śląskiego”.">
    <meta name="twitter:card"
          content="summary_large_image">
    <meta name="twitter:title"
          content="GeoSilesia">
    <meta name="twitter:description"
          content="GeoSilesia to „Edukacyjno-informacyjny serwis internetowy o dziedzictwie geologicznym, geomorfologicznym i poprzemysłowym województwa śląskiego”.">
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "GeoSilesia",
        "description": "GeoSilesia to „Edukacyjno-informacyjny serwis internetowy o dziedzictwie geologicznym, geomorfologicznym i poprzemysłowym województwa śląskiego”."
    }
    </script>
    <!--seo:end-->

    <!-- Icons come from favicon.svg and scripts/icons/icon-full.svg – see scripts/icons/build-icons.js. -->
    <link rel="icon"
          href="/favicon.ico"
          sizes="32x32">
    <link rel="icon"
          href="/favicon.svg"
          type="image/svg+xml">
    <link rel="apple-touch-icon"
          href="/apple-touch-icon.png">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">
    <meta name="theme-color"
          content="#1e4d2f" />

    <link rel="preconnect"
          href="https://fonts.googleapis.com">
    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Barlow+Condensed:wght@600;700;800&display=swap"
          rel="stylesheet">

    <link rel="manifest"
          href="/manifest.json">
</head>

<body>
    <app-root></app-root>
    <!-- Page content arrives rendered by the server, so it can be read without JavaScript –
         the message is a bar, not an overlay. -->
    <noscript class="noscript">
        <p class="noscript__text">Część funkcji serwisu działa tylko z włączonym JavaScriptem.</p>
    </noscript>
</body>

</html>
