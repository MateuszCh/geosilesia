<!DOCTYPE html>
<html lang="pl-PL">

<head>
    <!-- src/index.html -->
    <meta charset="UTF-8">
    <base href="/">

    <!-- Block replaced per page by the server (app.js) – it inserts the canonical, og:url
         and absolute URLs. The content below is a fallback for when the file reaches the
         browser bypassing the server (service worker cache). There is deliberately no
         og:image or logo here: OG and schema.org require absolute URLs, and the domain is
         unknown at build time – a scraper would ignore a relative path anyway.
         Do not touch the seo:start / seo:end markers. -->
    <!--seo:start-->
    <title>GeoSilesia</title>
    <meta name="description"
          content="GeoSilesia to „Edukacyjno-informacyjny serwis internetowy o dziedzictwie geologicznym, geomorfologicznym i poprzemysłowym województwa śląskiego”.">
    <meta property="og:type"
          content="website">
    <meta property="og:site_name"
          content="GeoSilesia">
    <meta property="og:title"
          content="GeoSilesia">
    <meta property="og:description"
          content="GeoSilesia to „Edukacyjno-informacyjny serwis internetowy o dziedzictwie geologicznym, geomorfologicznym i poprzemysłowym województwa śląskiego”.">
    <meta name="twitter:card"
          content="summary_large_image">
    <meta name="twitter:title"
          content="GeoSilesia">
    <meta name="twitter:description"
          content="GeoSilesia to „Edukacyjno-informacyjny serwis internetowy o dziedzictwie geologicznym, geomorfologicznym i poprzemysłowym województwa śląskiego”.">
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "GeoSilesia",
        "description": "GeoSilesia to „Edukacyjno-informacyjny serwis internetowy o dziedzictwie geologicznym, geomorfologicznym i poprzemysłowym województwa śląskiego”."
    }
    </script>
    <!--seo:end-->

    <!-- Icons come from favicon.svg and scripts/icons/icon-full.svg – see scripts/icons/build-icons.js. -->
    <link rel="icon"
          href="/favicon.ico"
          sizes="32x32">
    <link rel="icon"
          href="/favicon.svg"
          type="image/svg+xml">
    <link rel="apple-touch-icon"
          href="/apple-touch-icon.png">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">
    <meta name="theme-color"
          content="#1e4d2f" />

    <!--
        Barlow and Barlow Condensed are self-hosted: loading them from Google Fonts would send
        every visitor's IP to Google. The woff2 files come from @fontsource and are copied to
        /fonts by the "assets" in angular.json.

        The @font-face rules live here, inline, and not in styles.css: the server render inlines
        only the critical CSS and loads styles.css asynchronously, so fonts declared there would
        be discovered late and every reload would flash the fallback font. The preloads fetch the
        regular text and the 800 headings (latin + latin-ext, for the Polish letters) right away.
    -->
    <link rel="preload" href="/fonts/barlow-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/barlow-latin-ext-400-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/barlow-condensed-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/barlow-condensed-latin-ext-800-normal.woff2" as="font" type="font/woff2" crossorigin>
