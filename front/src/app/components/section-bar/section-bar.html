<nav class="section-bar"
     [attr.aria-label]="'Dział ' + section().title">
    @for (link of section().links; track link.link) {
        <a class="section-bar__link"
           [routerLink]="link.link"
           [class.section-bar__link--current]="link.current"
           [attr.aria-current]="link.current ? 'page' : null">{{ link.title }}</a>
    }
</nav>
