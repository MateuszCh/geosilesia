@switch (component().type) {
    @case ('h1') { <h2 [class]="headingClass()">{{ component().text }}</h2> }
    @case ('h2') { <h2 [class]="headingClass()">{{ component().text }}</h2> }
    @case ('h3') { <h3 [class]="headingClass()">{{ component().text }}</h3> }
    @default { <h4 [class]="headingClass()">{{ component().text }}</h4> }
}
