<form class="map-search"
      role="search"
      [attr.aria-label]="component().title || 'Wyszukiwarka atrakcji'"
      (submit)="submit($event)">
    @if (component().title) {
        <h2 class="map-search__title">{{ component().title }}</h2>
    }
    <div class="segmented map-search__modes"
         role="group"
         aria-label="Tryb wyszukiwania">
        <button class="segmented__button"
                type="button"
                [attr.aria-pressed]="mode() === 'location'"
                (click)="mode.set('location')">Lokalizacja</button>
        <button class="segmented__button"
                type="button"
                [attr.aria-pressed]="mode() === 'name'"
                (click)="mode.set('name')">Nazwa obiektu</button>
    </div>
    <label class="visually-hidden"
           for="home-search">{{ mode() === 'name' ? 'Nazwa obiektu' : 'Lokalizacja' }}</label>
    <input id="home-search"
           class="map-search__input"
           type="text"
           autocomplete="off"
           [placeholder]="mode() === 'name' ? 'Wpisz nazwę obiektu' : 'Skąd ruszasz? np. Zawiercie'"
           [value]="query()"
           (input)="query.set($any($event.target).value)">
    <button class="btn btn--secondary btn--large map-search__locate"
            type="button"
            (click)="myLocation()">
        <svg width="18"
             height="18"
             viewBox="0 0 24 24"
             aria-hidden="true">
            <path d="M3 11l18-8-8 18-2-8z"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linejoin="round" />
        </svg>
        Moja lokalizacja
    </button>
    <button class="btn btn--primary btn--large map-search__submit"
            type="submit">{{ component().button_label || 'Szukaj na mapie' }}</button>
</form>
