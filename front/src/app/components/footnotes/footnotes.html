@if (component().items?.length) {
    <section class="footnotes"
             [attr.aria-label]="component().title || 'Przypisy'">
        @if (component().title) {
            <h2 class="footnotes__title">{{ component().title }}</h2>
        }
        <ol class="footnotes__list">
            @for (footnote of component().items; track $index) {
                <li class="footnotes__item">
                    <span class="footnotes__number">{{ footnote.position }}</span>
                    <span>{{ footnote.text }}</span>
                </li>
            }
        </ol>
    </section>
}
