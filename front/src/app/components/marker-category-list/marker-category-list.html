<div class="category-list">
    @if (component().text) {
        <p class="text-block__p">{{ component().text }}</p>
    }
    @if (items().length) {
        <ul class="category-list__items">
            @for (item of items(); track $index) {
                <li class="category-list__item"
                    [class.category-list__item--band]="item.color"
                    [style.--band]="item.color">
                    @if (item.icon) {
                        <img class="category-list__icon"
                             alt=""
                             [src]="item.icon">
                    }
                    <p class="category-list__text prose"
                       [innerHTML]="item.text"></p>
                </li>
            }
        </ul>
    }
</div>
