<section class="literature"
         [attr.aria-label]="component().title || 'Literatura'">
    <h2 class="literature__title">{{ component().title || 'Literatura' }}</h2>
    @if (component().items?.length) {
        <!-- Order as in the CMS. -->
        <ol class="literature__list">
            @for (item of component().items; track $index) {
                <li>
                    @if (item.author) {
                        <b>{{ item.author }}</b>
                    }
                    {{ item.item }}
                </li>
            }
        </ol>
    }
</section>
