<!DOCTYPE html>
<html lang="pl-PL">

<head>
    <!-- src/index.html -->
    <meta charset="UTF-8">
    <base href="/">

    <!-- Blok podmieniany per-stronę przez serwer (app.js) – to on wstawia canonical,
         og:url i adresy absolutne. Treść poniżej to fallback na wypadek, gdy plik trafi
         do przeglądarki z pominięciem serwera (cache service workera). Świadomie nie ma
         tu og:image ani logo: OG i schema.org wymagają adresów absolutnych, a domeny nie
         zna się na etapie buildu – scraper i tak zignorowałby ścieżkę względną.
         Markerów seo:start / seo:end nie ruszać. -->
    <!--seo:start-->
    <title>GeoSilesia</title>
    <meta name="description"
          content="GeoSilesia to „Edukacyjno-informacyjny serwis internetowy o dziedzictwie geologicznym, geomorfologicznym i poprzemysłowym województwa śląskiego”.">
    <meta property="og:type"
          content="website">
    <meta property="og:site_name"
          content="GeoSilesia">
    <meta property="og:title"
          content="GeoSilesia">
    <meta property="og:description"
          content="GeoSilesia to „Edukacyjno-informacyjny serwis internetowy o dziedzictwie geologicznym, geomorfologicznym i poprzemysłowym województwa śląskiego”.">
    <meta name="twitter:card"
          content="summary_large_image">
    <meta name="twitter:title"
          content="GeoSilesia">
    <meta name="twitter:description"
          content="GeoSilesia to „Edukacyjno-informacyjny serwis internetowy o dziedzictwie geologicznym, geomorfologicznym i poprzemysłowym województwa śląskiego”.">
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "GeoSilesia",
        "description": "GeoSilesia to „Edukacyjno-informacyjny serwis internetowy o dziedzictwie geologicznym, geomorfologicznym i poprzemysłowym województwa śląskiego”."
    }
    </script>
    <!--seo:end-->

    <link rel="shortcut icon"
          href="/images/favicon.ico"
          type="image/x-icon">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">
    <meta name="theme-color"
          content="#28293e" />

    <link rel="preconnect"
          href="https://fonts.googleapis.com">
    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>
    <link href="https://fonts.googleapis.com/css?family=Open+Sans:400,700|Poiret+One&subset=latin-ext"
          rel="stylesheet">

    <!-- inject:css -->
    <!-- endinject -->
    <link rel="manifest"
          href="/manifest.json">
</head>

<body ng-app="geosilesia"
      ng-controller="MainController">
    <header></header>
    <div ng-view
         class="fade"
         id="page"></div>
    <button class="button-up"
            id="scroll"
            ng-class="{'scrolled' : scrolled}"
            style="transform: scale(0)"
            du-smooth-scroll="page">
        <img class="button-up__image"
             alt="przewiń do góry"
             src="images/arrow.svg">
    </button>
    <noscript class="noscript">
        <h1 class="header__logo__heading">GeoSilesia</h1>
        <p>Strona wymaga JavaScriptu do prawidłowego działania</p>
    </noscript>
    <!-- inject:js -->
    <!-- endinject -->
</body>

</html>
